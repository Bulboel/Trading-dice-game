<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dés dépliables – prototype</title>
<style>
:root{--bg:#eef2f5;--tx:#1d2a33;--ce:#fbfdff;--ln:#9fb0bd;--bt:#dbe4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161d23;--tx:#e8eef2;--ce:#202a31;--ln:#46565f;--bt:#2b3740;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161d23;--tx:#e8eef2;--ce:#202a31;--ln:#46565f;--bt:#2b3740;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;padding:8px;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,sans-serif;text-align:center}
#hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px}
#bd{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,46vh);aspect-ratio:8/10;margin:6px auto;border:2px solid var(--ln)}
.c{position:relative;border:1px solid var(--ln);background:var(--ce);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:clamp(10px,3.4vw,16px)}
.z0{background-image:linear-gradient(rgba(47,154,95,.16),rgba(47,154,95,.16))}
.z1{background-image:linear-gradient(rgba(224,102,26,.16),rgba(224,102,26,.16))}
.o0{background:#2f9a5f}.o1{background:#e0661a}.f{opacity:.5}
.d{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;border:1px solid #fff}
.cr{position:absolute;font-size:clamp(16px,5.4vw,28px);filter:drop-shadow(0 1px 2px #0008)}
#bd{touch-action:none;user-select:none}.sel{outline:3px solid #fff;outline-offset:-3px}.pv{outline:3px solid #ffd21f;outline-offset:-3px}.bad{outline:3px solid #f22;outline-offset:-3px}
small{font-size:.7em;opacity:.9}
#roll{width:64px;height:64px;margin:4px auto;border:3px solid var(--ln);border-radius:12px;background:var(--ce);font-size:38px;font-weight:800;line-height:58px;visibility:hidden}#roll:not(:empty){visibility:visible}.rl{animation:sh .16s infinite}.win{border-color:#2f9a5f;color:#2f9a5f}.lose{border-color:#d22;color:#d22}@keyframes sh{50%{transform:rotate(14deg) scale(1.08)}}@media(prefers-reduced-motion:reduce){.rl{animation:none}}#msg{min-height:3.8em;margin:4px 0}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
button{font:inherit;color:var(--tx);background:var(--bt);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-height:44px}
button:disabled{opacity:.4}
.dc{flex:1;min-width:0;max-width:98px;padding:6px 3px;border-bottom-width:5px}.dc span{display:block;font-size:11px}.dc b{display:block}.cr{background:#fff8;border-radius:50%}.rc::after{content:"";position:absolute;width:34%;height:34%;border-radius:50%;background:#ffd21f;border:2px solid #fff}#bd .z1{border-bottom:3px solid #e0661a;background-image:linear-gradient(rgba(224,102,26,.3),rgba(224,102,26,.3))}#bd .z0{border-top:3px solid #2f9a5f;background-image:linear-gradient(rgba(47,154,95,.3),rgba(47,154,95,.3))}.zt{position:absolute;left:4px;top:2px;z-index:1;color:var(--tx);opacity:.75;white-space:nowrap;font-size:10px;pointer-events:none}#hl{font-size:13px;opacity:.8}
</style></head><body>
<div id="hd"></div><div id="bd"></div><div id="roll"></div><div id="msg"></div><div class="row" id="ct"></div><div id="hl"></div><div class="row" id="hand"></div>
<script>
const W=8,H=10,Z=1,WIN=5,P=['Vert','Orange'],D4=[[1,0],[-1,0],[0,1],[0,-1]];
const EC={eau:'#1e4fa0',feu:'#d22',glace:'#7de',terre:'#8a5a2b',vent:'#4c4',foudre:'#a3d'};
const BT={eau:'foudre',foudre:'vent',vent:'terre',terre:'glace',glace:'feu',feu:'eau'};
const M=[{n:'Foudre ✕',em:'🦎',el:'foudre',lv:5,c:[[1,0,2],[1,1,1],[1,2,5],[1,3,6],[0,1,3],[2,1,4]]},
{n:'Vent T',em:'🦆',el:'vent',lv:5,c:[[0,0,3],[1,0,1],[2,0,4],[1,1,2],[1,2,6],[1,3,5]]}];
let b,pl,cr,cur,mode,rot,pc,die,hi,msg,moved,over,drag,sel;
const $=i=>document.getElementById(i),at=(x,y)=>cr.find(c=>c.x==x&&c.y==y),inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const homeRow=()=>cur?0:H-1,inZone=(o,y)=>o?y<Z:y>=H-Z;
function init(){b=[...Array(H)].map(()=>Array(W).fill(null));cr=[];over=0;sel=null;drag=0;
 pl=[0,1].map(()=>{const d=[...Array(10)].map((_,k)=>k%2).sort(()=>Math.random()-.5);return{q:d,h:d.splice(0,5),s:0}});
 cur=0;mode='i';moved=0;msg='Vert : choisis un dé. Le premier dé se pose dans ta zone (en bas) ; la créature apparaît ensuite.';render()}
function net(m,r){let c=M[m].c.map(a=>[...a]);for(let i=0;i<r;i++)c=c.map(([x,y,v])=>[-y,x,v]);
 const mx=Math.min(...c.map(a=>a[0])),my=Math.min(...c.map(a=>a[1]));return c.map(([x,y,v])=>[x-mx,y-my,v])}
function cells(){if(mode!='p'||!pc)return[];const n=net(die,rot),w=Math.max(...n.map(a=>a[0]))+1,h=Math.max(...n.map(a=>a[1]))+1;
 return n.map(([x,y,v])=>[x+pc.x-(w>>1),y+pc.y-(h>>1),v])}
function ok(cs){let adj=0;for(const[x,y]of cs){if(!inb(x,y)||b[y][x])return 0;if(y==homeRow())adj=1;
 for(const[dx,dy]of D4){const c=(b[y+dy]||[])[x+dx];if(c&&c.o==cur)adj=1}}return adj}
function pw(x,y){const c=b[y][x];if(!c)return 0;if(c.el)for(const[dx,dy]of D4){const n=(b[y+dy]||[])[x+dx];if(n&&n.el==BT[c.el])return c.v+1}return c.v}
function bfs(c){const par={},q=[[c.x,c.y,0]];par[[c.x,c.y]]=null;
 while(q.length){const[x,y,d]=q.shift();if(d==3)continue;
  for(const[dx,dy]of D4){const X=x+dx,Y=y+dy;if(!inb(X,Y)||!b[Y][X]||par[[X,Y]]!==undefined)continue;
   par[[X,Y]]=[x,y];if(!at(X,Y))q.push([X,Y,d+1])}}return par}
const PIP=[0,[[.5,.5]],[[.25,.25],[.75,.75]],[[.25,.25],[.5,.5],[.75,.75]],[[.25,.25],[.75,.25],[.25,.75],[.75,.75]],[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],[[.25,.2],[.75,.2],[.25,.5],[.75,.5],[.25,.8],[.75,.8]]];
function svg(m,r){const n=net(m,r),w=Math.max(...n.map(a=>a[0]))+1,h=Math.max(...n.map(a=>a[1]))+1,col=EC[M[m].el],pc=M[m].el=='glace'?'#123':'#fff';
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%">'+n.map(([x,y,v])=>'<rect x="'+(x+.04)+'" y="'+(y+.04)+'" width=".92" height=".92" rx=".12" fill="'+col+'" stroke="'+(v==1?'#ffd21f':'#fff')+'" stroke-width="'+(v==1?.1:.03)+'"/>'+PIP[v].map(([a,b])=>'<circle cx="'+(x+a)+'" cy="'+(y+b)+'" r=".075" fill="'+pc+'"/>').join('')).join('')+'</svg>'}
function valide(x,y){const k=cur;pl[k].s++;const st=[[x,y]],seen={};
 while(st.length){const[i,j]=st.pop();if(!inb(i,j)||seen[[i,j]])continue;const c=b[j][i];if(!c||c.o!=k||c.f)continue;seen[[i,j]]=1;b[j][i]=null;
  cr=cr.filter(a=>!(a.x==i&&a.y==j));D4.forEach(([dx,dy])=>st.push([i+dx,j+dy]))}
 msg='Passage validé ('+pl[k].s+'/'+WIN+') ! Ton trajet disparaît.';if(pl[k].s>=WIN){over=1;msg='🏆 '+P[k]+' gagne la partie !'}}
function mv(c,x,y){const e=at(x,y);if(e&&e.o==c.o){msg='Case occupée par ta propre créature.';return}
 const par=bfs(c)[[x,y]];if(!par){msg='Impossible : case non colorée ou trop loin (3 pas max).';return}
 if(e){const a=pw(par[0],par[1]),d=pw(x,y);
  if(a>d){cr=cr.filter(z=>z!=e);c.x=x;c.y=y;msg='Attaque réussie ! '+a+' contre '+d+'. La créature adverse disparaît.'}
  else if(a<d){cr=cr.filter(z=>z!=c);msg='Attaque ratée : '+a+' contre '+d+'. Ta créature disparaît.'}
  else msg='Égalité '+a+'-'+d+' : personne ne bouge.'}
 else{c.x=x;c.y=y;msg='Créature avancée. Choisis maintenant un dé.'}
 moved=1;sel=null;const k=b[c.y]&&b[c.y][c.x];if(cr.includes(c)&&k&&k.o==cur&&!k.f&&inZone(1-cur,c.y))valide(c.x,c.y)}
function pick(i){hi=i;die=pl[cur].h[i];sel=null;mode='r';const lv=M[die].lv,r=1+Math.floor(Math.random()*6),R=$('roll');let n=0;
 msg='Lancer du dé '+M[die].n+'… il faut '+lv+' ou plus.';
 const t=setInterval(()=>{n++;const f=n<14?1+Math.floor(Math.random()*6):r;R.textContent=f;R.className=n<14?'rl':(r>=lv?'win':'lose');
  if(n>=14){clearInterval(t);
   if(r>=lv){mode='p';rot=cur?0:2;pc={x:3,y:cur?2:H-3};msg='Lancer : '+r+' (niveau '+lv+') ✔ Fais glisser le dé sur le damier (le sens est fixe), puis Poser.';render()}
   else if(b.flat().filter(c=>c&&c.f&&c.o==cur).length>=4){fin();msg='Lancer : '+r+' (niveau '+lv+') ✘ Tu as déjà 4 cases colorées : rien à colorer. '+msg;render()}
   else{mode='c';msg='Lancer : '+r+' (niveau '+lv+') ✘ Touche une case vide pour la colorer (4 cases maximum).';render()}}},80)}
function fin(){const p=pl[cur];p.q.push(p.h.splice(hi,1)[0]);
 if(over){mode='x';return}
 cur=1-cur;moved=0;mode='i';pc=null;sel=null;$('roll').textContent='';$('roll').className='';const n=pl[cur];while(n.h.length<5&&n.q.length)n.h.push(n.q.shift());
 msg=P[cur]+' : glisse une créature (facultatif), puis choisis un dé.'}
function poser(){const cs=cells();if(!cs.length||!ok(cs)){msg='Placement impossible : cases vides, collé à ta couleur ou à ta rangée de départ.';return}
 for(const[x,y,v]of cs)b[y][x]={o:cur,el:M[die].el,v};
 const f=cs.find(a=>a[2]==1);cr.push({o:cur,x:f[0],y:f[1],em:M[die].em});msg='Dé posé : une créature apparaît !';
 const z=cs.find(a=>inZone(1-cur,a[1]));if(z)valide(z[0],z[1]);fin()}
const B=$('bd'),cellAt=e=>{const r=B.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H)]};
B.onpointerdown=e=>{if(over)return;e.preventDefault();const[x,y]=cellAt(e);if(!inb(x,y))return;
 if(mode=='p'){drag=1;B.setPointerCapture(e.pointerId);pc={x,y}}
 else if(mode=='c'){if(b[y][x])msg='Case déjà occupée.';else{b[y][x]={o:cur,f:1,v:0};msg='Case colorée pour toujours.';fin()}}
 else if(mode=='i'){const c=at(x,y);if(c){if(c.o!=cur)msg='Cette créature est à '+P[c.o]+'. C’est le tour de '+P[cur]+'.';else if(moved)msg='Tu as déjà avancé ce tour : choisis un dé.';else{sel=c;B.setPointerCapture(e.pointerId);msg=Object.keys(bfs(c)).length>1?'Créature choisie : touche (ou glisse vers) une case marquée d’un point jaune.':'Cette créature ne peut pas avancer : elle ne marche que sur des cases colorées.'}}}
 render()};
B.onpointermove=e=>{if(drag){const[x,y]=cellAt(e);pc={x,y};render()}};
B.onpointerup=e=>{if(drag){drag=0}else if(mode=='i'&&sel){const[x,y]=cellAt(e);if(inb(x,y)&&(x!=sel.x||y!=sel.y))mv(sel,x,y)}render()};
function render(){const R=(mode=='i'&&sel)?bfs(sel):null,cs=cells(),bad=cs.length&&!ok(cs);B.innerHTML='';
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=b[y][x],d=document.createElement('div');
  d.className='c'+(y<Z?' z1':'')+(y>=H-Z?' z0':'')+(c?' o'+c.o+(c.f?' f':''):'');let h='';if(x==0&&(y==0||y==H-1))h+='<small class="zt">'+(y?'Zone Vert':'Zone Orange')+'</small>';
  if(c&&!c.f){const q=pw(x,y);h=(q>c.v?c.v+'<small>+1</small>':c.v)+'<i class="d" style="background:'+EC[c.el]+'"></i>'}
  const p=cs.find(a=>a[0]==x&&a[1]==y);if(p){d.classList.add(bad?'bad':'pv');h+='<small>'+p[2]+'</small>'}
  const k=at(x,y);if(R&&R[[x,y]]!==undefined&&!(k&&k.o==cur))d.classList.add('rc');if(k){h+='<span class="cr">'+k.em+'</span>';if(k==sel)d.classList.add('sel')}
  d.innerHTML=h;B.append(d)}
 $('hd').innerHTML='<span>'+pl[0].s+'/'+WIN+' Vert</span><span>'+(over?'Fin':'Tour : '+P[cur])+'</span><span>Orange '+pl[1].s+'/'+WIN+'</span>';
 $('msg').textContent=msg;
 $('ct').innerHTML=mode=='p'?'<button onclick="poser();render()">Poser ✓</button>':over?'<button onclick="init()">Rejouer</button>':'';
 $('hl').textContent=over?'':mode=='i'?'Main de '+P[cur]+' : touche un dé pour le lancer':'';
 $('hand').innerHTML=over?'':pl[cur].h.map((m,i)=>'<button class="dc" style="border-bottom-color:'+EC[M[m].el]+'" '+(mode=='i'?'':'disabled')+' onclick="pick('+i+');render()">'+svg(m,cur?0:2)+'<b>Niv. '+M[m].lv+'</b><span>'+M[m].el+'</span></button>').join('')}
init();
</script></body></html>
