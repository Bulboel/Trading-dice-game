# Publication GitHub Pages (Jekyll).
# assets/Models/ contient les fichiers sources envoyés (exports 3D complets, miniatures d'origine) : ils restent
# dans le dépôt mais ne sont pas publiés. Le jeu charge les versions légères de assets/models-web/
# (scripts/optimize-models.py), les clips de assets/characters/ et les portraits WebP
# (scripts/build-character-assets.py). Sans cette exclusion, le site dépasse la limite de 1 Go de GitHub Pages.
exclude:
  - assets/Models
  - tests
  - scripts
  - node_modules
